<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Schedule Tracker</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0f0f0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Schedule"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2a2a2a;
  --accent:#c8f57c;--accent-dim:#a0c45a;--text:#e8e8e8;--muted:#888;
  --red:#ff5555;--amber:#ffb347;--green:#c8f57c;
  --radius:12px;--radius-sm:8px;
}
html{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px}
body{min-height:100vh;max-width:540px;margin:0 auto;padding-bottom:80px}
/* header */
#header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px 0}
#header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#hdate{font-size:13px;color:var(--muted);font-family:'DM Mono',monospace}
#stats{display:flex;gap:8px}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;font-family:'DM Mono',monospace;color:var(--muted)}
.chip span{color:var(--accent);font-weight:600}
/* sync bar */
#sync-bar{display:flex;align-items:center;gap:6px;padding:4px 0 10px;font-size:12px;color:var(--muted);font-family:'DM Mono',monospace}
#sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s}
#sync-bar.syncing #sync-dot{background:var(--amber);animation:pulse 1s infinite}
#sync-bar.ok #sync-dot{background:var(--accent)}
#sync-bar.error #sync-dot{background:var(--red)}
/* tabs */
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 14px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:color .2s}
.tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
/* form */
#form-section{padding:14px 16px;border-bottom:1px solid var(--border)}
#form-row{display:flex;gap:8px;margin-bottom:10px}
#title-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 12px;outline:none;transition:border-color .2s}
#title-input:focus{border-color:var(--accent)}
#add-btn{background:var(--accent);color:#0f0f0f;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:opacity .2s}
#add-btn:active{opacity:.8}
#form-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#dt-toggle{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted);font-size:12px;padding:5px 10px;cursor:pointer;font-family:'DM Mono',monospace}
#dt-toggle.active{border-color:var(--accent);color:var(--accent)}
#dt-input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:5px 10px;outline:none;font-family:'DM Mono',monospace;display:none}
#dt-input.show{display:block}
#dt-input:focus{border-color:var(--accent)}
select.meta-select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:5px 10px;outline:none;cursor:pointer;font-family:'DM Mono',monospace}
select.meta-select:focus{border-color:var(--accent)}
/* list */
#list-section{padding:0 16px}
.day-sep{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);padding:14px 0 6px;letter-spacing:.05em;text-transform:uppercase}
/* item */
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;animation:slideIn .2s ease;transition:opacity .3s}
.item.urgent{border-left:3px solid var(--red)}
.item.done-item{opacity:.45}
.item.done-item .item-title{text-decoration:line-through}
.item-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.item-check.checked{background:var(--accent);border-color:var(--accent)}
.item-check.checked::after{content:'✓';font-size:10px;color:#0f0f0f;font-weight:700}
.item-body{flex:1;min-width:0}
.item-title{font-size:14px;font-weight:500;margin-bottom:5px;word-break:break-word}
.item-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-family:'DM Mono',monospace;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--border)}
.tag.cat{background:var(--surface2);color:var(--muted)}
.tag.urgent-tag{background:rgba(255,85,85,.15);border-color:rgba(255,85,85,.4);color:var(--red)}
.tag.nodate{background:var(--surface2);color:var(--muted)}
.tag.dt{background:var(--surface2)}
.tag.dt.overdue{color:var(--red);border-color:rgba(255,85,85,.4)}
.tag.dt.soon{color:var(--amber);border-color:rgba(255,179,71,.4)}
.tag.dt.ok{color:var(--accent)}
.item-del{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px;flex-shrink:0;transition:color .2s}
.item-del:hover{color:var(--red)}
/* empty */
.empty{text-align:center;padding:48px 0;color:var(--muted);font-size:14px}
.empty-icon{font-size:36px;margin-bottom:10px}
/* calendar */
#cal-section{padding:14px 16px;display:none}
#cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
#cal-label{font-size:15px;font-weight:600}
.cal-nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:5px 12px;cursor:pointer;font-size:14px}
#cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-dow{text-align:center;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);padding:4px 0}
.cal-day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 4px;text-align:center;cursor:pointer;min-height:46px;transition:border-color .2s;position:relative}
.cal-day:hover{border-color:var(--accent)}
.cal-day.today{border-color:var(--accent)}
.cal-day.empty-day{background:transparent;border-color:transparent;cursor:default}
.cal-day.selected{background:rgba(200,245,124,.1);border-color:var(--accent)}
.cal-day-num{font-size:13px;font-weight:500}
.cal-dots{display:flex;justify-content:center;gap:3px;margin-top:4px;flex-wrap:wrap}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-dot.pending{background:var(--accent)}
.cal-dot.done{background:var(--muted)}
#cal-day-events{border-top:1px solid var(--border);padding-top:14px}
#cal-day-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;font-family:'DM Mono',monospace}
/* iOS banner */
#ios-banner{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:12px 16px;padding:12px 14px;font-size:13px;align-items:center;gap:10px}
#ios-banner-text{flex:1;color:var(--muted)}
#ios-banner-text strong{color:var(--text)}
#ios-banner-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px}
/* install btn */
#install-btn{display:none;position:fixed;bottom:20px;right:16px;background:var(--accent);color:#0f0f0f;border:none;border-radius:var(--radius);padding:10px 18px;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 4px 20px rgba(200,245,124,.3);z-index:200}
/* toast */
#toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:380px}
.toast{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;animation:slideIn .25s ease;pointer-events:auto;display:flex;align-items:center;gap:8px}
.toast.err{border-color:rgba(255,85,85,.5);color:var(--red)}
.toast.ok{border-color:rgba(200,245,124,.4);color:var(--accent)}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div id="ios-banner">
  <span id="ios-banner-text">Install: tap <strong>Share</strong> then <strong>Add to Home Screen</strong></span>
  <button id="ios-banner-close" aria-label="Dismiss">×</button>
</div>

<div id="header">
  <div id="header-top">
    <div id="hdate"></div>
    <div id="stats">
      <div class="chip">Today <span id="stat-today">0</span></div>
      <div class="chip">Done <span id="stat-done">0</span></div>
      <div class="chip">Total <span id="stat-total">0</span></div>
    </div>
  </div>
  <div id="sync-bar">
    <div id="sync-dot"></div>
    <span id="sync-label">idle</span>
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="all">All</button>
    <button class="tab" data-tab="today">Today</button>
    <button class="tab" data-tab="upcoming">Upcoming</button>
    <button class="tab" data-tab="done">Done</button>
    <button class="tab" data-tab="calendar">Calendar</button>
  </div>
</div>

<div id="form-section">
  <div id="form-row">
    <input id="title-input" type="text" placeholder="Add event…" autocomplete="off"/>
    <button id="add-btn">Add</button>
  </div>
  <div id="form-meta">
    <button id="dt-toggle">+ date/time</button>
    <input id="dt-input" type="datetime-local"/>
    <select id="cat-select" class="meta-select">
      <option value="Work">Work</option>
      <option value="Personal">Personal</option>
      <option value="Health">Health</option>
      <option value="Other" selected>Other</option>
    </select>
    <select id="pri-select" class="meta-select">
      <option value="Normal" selected>Normal</option>
      <option value="Urgent">Urgent</option>
    </select>
  </div>
</div>

<div id="list-section"></div>
<div id="cal-section">
  <div id="cal-nav">
    <button class="cal-nav-btn" id="cal-prev">&#8249;</button>
    <div id="cal-label"></div>
    <button class="cal-nav-btn" id="cal-next">&#8250;</button>
  </div>
  <div id="cal-grid"></div>
  <div id="cal-day-events"></div>
</div>

<button id="install-btn">Install App</button>
<div id="toast-container"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyb8USqH5nvZm8mnXYzH8ZVQXiaE-jgNh4UBC22pi2dNsoqmeqOKdh0jTPa7M8RXhYDMA/exec';
const SECRET = 'mango-jack-banana';
const CACHE_KEY = 'sched_cache_v1';

let items = [];
let activeTab = 'all';
let calYear, calMonth, calSelected = null;
let deferredInstall = null;

// ── helpers ──────────────────────────────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const isDone = v => v === true || v === 'TRUE';
const todayStr = () => new Date().toISOString().slice(0, 10);

function syncStatus(state, label) {
  const bar = document.getElementById('sync-bar');
  bar.className = state;
  document.getElementById('sync-label').textContent = label;
}

function toast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' err' : type === 'ok' ? ' ok' : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch {}
}

function loadCache() {
  try {
    const d = localStorage.getItem(CACHE_KEY);
    if (d) items = JSON.parse(d);
  } catch {}
}

// ── API ───────────────────────────────────────────────────────────────────────
async function fetchItems() {
  syncStatus('syncing', 'syncing…');
  try {
    const res = await fetch(API + '?key=' + SECRET);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    items = Array.isArray(data) ? data : (data.items || []);
    saveCache();
    syncStatus('ok', 'synced');
    render();
  } catch (e) {
    syncStatus('error', 'offline');
    if (!items.length) loadCache();
    render();
  }
}

async function apiPost(body) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...body, key: SECRET })
  });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

// ── CRUD with optimistic updates ──────────────────────────────────────────────
async function addItem(item) {
  items.unshift(item);
  saveCache();
  render();
  toast('Event added', 'ok');
  syncStatus('syncing', 'saving…');
  try {
    await apiPost({ action: 'add', item });
    syncStatus('ok', 'synced');
  } catch {
    items = items.filter(i => i.id !== item.id);
    saveCache();
    render();
    syncStatus('error', 'save failed');
    toast('Failed to save — removed', 'error');
  }
}

async function toggleItem(id) {
  const idx = items.findIndex(i => i.id === id);
  if (idx < 0) return;
  const prev = items[idx].done;
  items[idx].done = !isDone(items[idx].done);
  saveCache();
  render();
  syncStatus('syncing', 'saving…');
  try {
    await apiPost({ action: 'toggle', item: { id, done: items[idx].done } });
    syncStatus('ok', 'synced');
  } catch {
    items[idx].done = prev;
    saveCache();
    render();
    syncStatus('error', 'sync failed');
    toast('Sync failed', 'error');
  }
}

async function deleteItem(id) {
  const backup = [...items];
  items = items.filter(i => i.id !== id);
  saveCache();
  render();
  toast('Deleted', 'ok');
  syncStatus('syncing', 'deleting…');
  try {
    await apiPost({ action: 'delete', item: { id } });
    syncStatus('ok', 'synced');
  } catch {
    items = backup;
    saveCache();
    render();
    syncStatus('error', 'delete failed');
    toast('Delete failed — restored', 'error');
  }
}

// ── render helpers ────────────────────────────────────────────────────────────
function dtTag(dt) {
  if (!dt) return `<span class="tag nodate">no date</span>`;
  const d = new Date(dt);
  const now = new Date();
  const diff = d - now;
  let cls = 'ok';
  if (diff < 0) cls = 'overdue';
  else if (diff < 86400000) cls = 'soon';
  const label = d.toLocaleDateString('en-SG', { day:'2-digit', month:'short' })
    + ' ' + d.toLocaleTimeString('en-SG', { hour:'2-digit', minute:'2-digit', hour12:false });
  return `<span class="tag dt ${cls}">${label}</span>`;
}

function buildItem(item, inCal = false) {
  const done = isDone(item.done);
  const urgent = item.pri === 'Urgent';
  const div = document.createElement('div');
  div.className = `item${urgent ? ' urgent' : ''}${done ? ' done-item' : ''}`;
  div.innerHTML = `
    <div class="item-check${done ? ' checked' : ''}" data-id="${item.id}" role="button" aria-label="Toggle done"></div>
    <div class="item-body">
      <div class="item-title">${escHtml(item.title)}</div>
      <div class="item-tags">
        ${dtTag(item.dt)}
        <span class="tag cat">${escHtml(item.cat || 'Other')}</span>
        ${urgent ? '<span class="tag urgent-tag">Urgent</span>' : ''}
      </div>
    </div>
    <button class="item-del" data-id="${item.id}" aria-label="Delete">×</button>`;
  div.querySelector('.item-check').addEventListener('click', () => toggleItem(item.id));
  div.querySelector('.item-del').addEventListener('click', () => deleteItem(item.id));
  return div;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filteredItems() {
  const now = new Date();
  const tod = todayStr();
  switch (activeTab) {
    case 'today':
      return items.filter(i => i.dt && i.dt.slice(0,10) === tod && !isDone(i.done));
    case 'upcoming':
      return items.filter(i => i.dt && i.dt.slice(0,10) > tod && !isDone(i.done));
    case 'done':
      return items.filter(i => isDone(i.done));
    default:
      return [...items];
  }
}

function render() {
  updateStats();
  if (activeTab === 'calendar') { renderCalendar(); return; }
  const sec = document.getElementById('list-section');
  sec.innerHTML = '';
  const list = filteredItems();
  if (!list.length) {
    sec.innerHTML = '<div class="empty"><div class="empty-icon">📅</div>No events here</div>';
    return;
  }
  // group by date
  const groups = {};
  const nodate = [];
  list.forEach(item => {
    if (!item.dt) { nodate.push(item); return; }
    const d = item.dt.slice(0, 10);
    (groups[d] = groups[d] || []).push(item);
  });
  const sortedDates = Object.keys(groups).sort();
  sortedDates.forEach(date => {
    const sep = document.createElement('div');
    sep.className = 'day-sep';
    const d = new Date(date + 'T00:00');
    sep.textContent = d.toLocaleDateString('en-SG', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
    sec.appendChild(sep);
    groups[date].forEach(item => sec.appendChild(buildItem(item)));
  });
  if (nodate.length) {
    const sep = document.createElement('div');
    sep.className = 'day-sep';
    sep.textContent = 'No date';
    sec.appendChild(sep);
    nodate.forEach(item => sec.appendChild(buildItem(item)));
  }
}

function updateStats() {
  const tod = todayStr();
  document.getElementById('stat-today').textContent = items.filter(i => i.dt && i.dt.slice(0,10) === tod && !isDone(i.done)).length;
  document.getElementById('stat-done').textContent = items.filter(i => isDone(i.done)).length;
  document.getElementById('stat-total').textContent = items.length;
}

// ── calendar ──────────────────────────────────────────────────────────────────
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  document.getElementById('cal-label').textContent = `${MONTHS[calMonth]} ${calYear}`;
  grid.innerHTML = '';
  DOWS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });
  const first = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todStr = todayStr();
  for (let i = 0; i < first; i++) {
    const el = document.createElement('div'); el.className = 'cal-day empty-day'; grid.appendChild(el);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayItems = items.filter(i => i.dt && i.dt.slice(0,10) === dStr);
    const el = document.createElement('div');
    el.className = 'cal-day' + (dStr === todStr ? ' today' : '') + (calSelected === dStr ? ' selected' : '');
    el.innerHTML = `<div class="cal-day-num">${d}</div>`;
    if (dayItems.length) {
      const dots = document.createElement('div'); dots.className = 'cal-dots';
      const pending = dayItems.filter(i => !isDone(i.done)).length;
      const done = dayItems.filter(i => isDone(i.done)).length;
      for (let p = 0; p < Math.min(pending, 3); p++) { const dot = document.createElement('div'); dot.className = 'cal-dot pending'; dots.appendChild(dot); }
      for (let p = 0; p < Math.min(done, 2); p++) { const dot = document.createElement('div'); dot.className = 'cal-dot done'; dots.appendChild(dot); }
      el.appendChild(dots);
    }
    el.addEventListener('click', () => { calSelected = dStr; renderCalendar(); renderCalDay(dStr); });
    grid.appendChild(el);
  }
  if (calSelected) renderCalDay(calSelected);
}

function renderCalDay(dStr) {
  const sec = document.getElementById('cal-day-events');
  const dayItems = items.filter(i => i.dt && i.dt.slice(0,10) === dStr);
  const d = new Date(dStr + 'T00:00');
  document.getElementById('cal-day-title').textContent = d.toLocaleDateString('en-SG', { weekday:'long', day:'2-digit', month:'long' });
  sec.innerHTML = '';
  sec.appendChild(Object.assign(document.createElement('div'), { id: 'cal-day-title', textContent: d.toLocaleDateString('en-SG', { weekday:'long', day:'2-digit', month:'long' }) }));
  if (!dayItems.length) {
    sec.innerHTML += '<div class="empty" style="padding:20px 0">No events this day</div>';
    return;
  }
  dayItems.forEach(item => sec.appendChild(buildItem(item, true)));
}

// ── tabs & calendar nav ───────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    const isCalendar = activeTab === 'calendar';
    document.getElementById('list-section').style.display = isCalendar ? 'none' : '';
    document.getElementById('cal-section').style.display = isCalendar ? 'block' : 'none';
    render();
  });
});

document.getElementById('cal-prev').addEventListener('click', () => {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } calSelected = null; renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } calSelected = null; renderCalendar();
});

// ── add form ──────────────────────────────────────────────────────────────────
const dtToggle = document.getElementById('dt-toggle');
const dtInput = document.getElementById('dt-input');
dtToggle.addEventListener('click', () => {
  const on = dtInput.classList.toggle('show');
  dtToggle.classList.toggle('active', on);
  dtToggle.textContent = on ? '− date/time' : '+ date/time';
});

function submitForm() {
  const title = document.getElementById('title-input').value.trim();
  if (!title) { toast('Enter an event title', 'error'); return; }
  const dt = dtInput.classList.contains('show') ? dtInput.value || null : null;
  const cat = document.getElementById('cat-select').value;
  const pri = document.getElementById('pri-select').value;
  const item = { id: uid(), title, dt, cat, pri, done: false, created: new Date().toISOString() };
  document.getElementById('title-input').value = '';
  dtInput.value = '';
  addItem(item);
}

document.getElementById('add-btn').addEventListener('click', submitForm);
document.getElementById('title-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitForm(); });

// ── iOS banner ────────────────────────────────────────────────────────────────
function isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isStandalone() { return window.navigator.standalone === true; }

if (isIos() && !isStandalone() && !sessionStorage.getItem('ios_banner_shown')) {
  document.getElementById('ios-banner').style.display = 'flex';
  sessionStorage.setItem('ios_banner_shown', '1');
}
document.getElementById('ios-banner-close').addEventListener('click', () => {
  document.getElementById('ios-banner').style.display = 'none';
});

// ── Android/desktop install ───────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  document.getElementById('install-btn').style.display = 'block';
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  const { outcome } = await deferredInstall.userChoice;
  if (outcome === 'accepted') document.getElementById('install-btn').style.display = 'none';
  deferredInstall = null;
});

// ── visibility refresh ────────────────────────────────────────────────────────
document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchItems(); });

// ── header date ───────────────────────────────────────────────────────────────
function setHeaderDate() {
  document.getElementById('hdate').textContent = new Date().toLocaleDateString('en-SG', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

// ── service worker ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ── init ──────────────────────────────────────────────────────────────────────
(function init() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  setHeaderDate();
  loadCache();
  render();
  fetchItems();
})();
</script>
</body>
</html>
