<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    html, body { height: 100%; overflow: hidden; background: #f1f5f9; }

    /* Panel transitions */
    .panel-base {
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* Custom scrollbar */
    .scroll-y::-webkit-scrollbar { width: 3px; }
    .scroll-y::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    .scroll-y { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }

    /* Spin animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* Pulse skeleton */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .skeleton { animation: pulse 1.5s ease-in-out infinite; }

    /* Checkbox sizing */
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      min-width: 22px;
      cursor: pointer;
      accent-color: #6366f1;
      border-radius: 4px;
    }

    /* Touch highlight suppression */
    * { -webkit-tap-highlight-color: transparent; }

    /* Safe area insets for iPhone notch */
    .safe-top    { padding-top:    env(safe-area-inset-top,    0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  </style>
</head>

<body class="h-full overflow-hidden bg-slate-100" x-data="calendarApp()" x-init="init()" x-cloak>

  <!-- ═══════════ LOADING OVERLAY ═══════════ -->
  <div x-show="loading" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white">
    <div class="w-12 h-12 rounded-full border-4 border-indigo-500 border-t-transparent spin mb-4"></div>
    <p class="text-slate-500 text-sm font-medium">Loading calendar…</p>
  </div>

  <!-- ═══════════ ERROR TOAST ═══════════ -->
  <div x-show="error" x-cloak
    class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] bg-red-500 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-xl max-w-xs text-center cursor-pointer select-none"
    @click="error = null"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-2 -translate-x-1/2"
    x-transition:enter-end="opacity-100 translate-y-0 -translate-x-1/2"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-end="opacity-0 -translate-x-1/2">
    <span x-text="error"></span>
  </div>

  <!-- ═══════════ SYNC BADGE ═══════════ -->
  <div x-show="syncing" x-cloak
    class="fixed top-4 right-4 z-50 flex items-center gap-2 bg-white shadow-lg rounded-full px-3 py-1.5 border border-slate-200">
    <div class="w-3 h-3 rounded-full border-2 border-indigo-500 border-t-transparent spin"></div>
    <span class="text-xs text-slate-500 font-medium">Syncing…</span>
  </div>

  <!-- ═══════════ MAIN LAYOUT ═══════════ -->
  <div class="flex flex-col h-full safe-top">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 px-3 py-2.5 flex items-center justify-between shrink-0 shadow-sm">
      <div class="flex items-center gap-1">
        <button @click="prevMonth()"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 active:bg-slate-200 transition-colors"
          aria-label="Previous month">
          <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <h1 class="text-base sm:text-lg font-bold text-slate-800 min-w-[140px] text-center select-none"
          x-text="monthName"></h1>
        <button @click="nextMonth()"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 active:bg-slate-200 transition-colors"
          aria-label="Next month">
          <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
      <div class="flex items-center gap-1">
        <button @click="goToToday()"
          class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 px-3 py-2 rounded-lg hover:bg-indigo-50 active:bg-indigo-100 transition-colors">
          Today
        </button>
        <button @click="fetchEvents()"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 active:bg-slate-200 transition-colors"
          aria-label="Refresh">
          <svg class="w-4.5 h-4.5 text-slate-500" :class="{ 'spin': loading }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- WEEKDAY LABELS -->
    <div class="grid grid-cols-7 bg-white border-b border-slate-200 shrink-0">
      <template x-for="day in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']">
        <div class="py-2 text-center text-xs font-semibold text-slate-400 uppercase tracking-wider select-none"
          x-text="day"></div>
      </template>
    </div>

    <!-- CALENDAR GRID -->
    <div class="flex-1 overflow-y-auto scroll-y">
      <div class="grid grid-cols-7" style="grid-auto-rows: minmax(72px, 1fr)">
        <template x-for="(day, idx) in calendarDays" :key="idx">
          <div
            @click="selectDay(day.date)"
            :class="{
              'opacity-30 pointer-events-none': !day.isCurrentMonth,
              'bg-indigo-50/60': isSelected(day.date) && !isToday(day.date),
              'ring-2 ring-inset ring-indigo-500': isSelected(day.date)
            }"
            class="border-r border-b border-slate-100 p-1 sm:p-1.5 cursor-pointer hover:bg-slate-50 active:bg-indigo-50 transition-colors select-none relative flex flex-col bg-white">

            <!-- Day number -->
            <div class="flex items-start justify-between mb-0.5">
              <span
                :class="isToday(day.date)
                  ? 'bg-indigo-500 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shadow-sm'
                  : 'text-xs sm:text-sm font-semibold text-slate-700 px-1 leading-7'"
                x-text="day.date.getDate()">
              </span>
              <!-- Count badge for mobile -->
              <span
                x-show="eventsForDate(day.date).length > 0"
                class="text-[9px] font-bold text-slate-400 sm:hidden leading-7 pr-0.5"
                x-text="eventsForDate(day.date).length"></span>
            </div>

            <!-- Event labels (desktop) -->
            <div class="hidden sm:flex flex-col gap-0.5 overflow-hidden">
              <template x-for="(evt, ei) in eventsForDate(day.date).slice(0, 3)" :key="evt.id">
                <div
                  :class="evt.isCompleted
                    ? 'bg-slate-100 text-slate-400 line-through opacity-50'
                    : priorityEventClass(evt.priority)"
                  class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md truncate leading-tight">
                  <span x-text="evt.timestamp ? evt.timestamp + ' ' : ''"></span>
                  <span x-text="evt.title"></span>
                </div>
              </template>
              <div
                x-show="eventsForDate(day.date).length > 3"
                class="text-[10px] text-slate-400 font-medium pl-1"
                x-text="`+${eventsForDate(day.date).length - 3} more`">
              </div>
            </div>

            <!-- Event dots (mobile) -->
            <div class="flex sm:hidden flex-wrap gap-1 mt-auto pb-0.5 pl-0.5">
              <template x-for="(evt, ei) in eventsForDate(day.date).slice(0, 3)" :key="evt.id">
                <div
                  :class="evt.isCompleted ? 'bg-slate-400' : 'bg-emerald-500'"
                  class="w-1.5 h-1.5 rounded-full">
                </div>
              </template>
              <span
                x-show="eventsForDate(day.date).length > 3"
                class="text-[9px] text-slate-400 font-bold leading-none self-center"
                x-text="`+${eventsForDate(day.date).length - 3}`">
              </span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div><!-- end main layout -->

  <!-- ═══════════ BACKDROP ═══════════ -->
  <div
    x-show="panelOpen"
    @click="closePanel()"
    class="fixed inset-0 z-30"
    :class="isMobile ? 'bg-black/40' : 'bg-black/10'"
    x-transition:enter="transition duration-250 ease-out"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition duration-200 ease-in"
    x-transition:leave-end="opacity-0">
  </div>

  <!-- ═══════════ DAY DETAIL PANEL ═══════════ -->
  <div
    class="fixed z-40 bg-white shadow-2xl panel-base overflow-hidden flex flex-col"
    :class="isMobile
      ? 'bottom-0 left-0 right-0 rounded-t-2xl'
      : 'top-0 right-0 bottom-0 w-96 border-l border-slate-200'"
    :style="panelTransform"
    style="max-height: 90vh"
    :style="isMobile ? { transform: panelOpen ? 'translateY(0)' : 'translateY(100%)', transition: 'transform 0.35s cubic-bezier(0.32,0.72,0,1)', maxHeight: '90vh' } : { transform: panelOpen ? 'translateX(0)' : 'translateX(100%)', transition: 'transform 0.35s cubic-bezier(0.32,0.72,0,1)', maxHeight: '100vh' }">

    <!-- Panel handle (mobile only) -->
    <div x-show="isMobile" class="flex justify-center pt-3 pb-1 shrink-0 cursor-pointer" @click="closePanel()">
      <div class="w-10 h-1 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Panel Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 shrink-0">
      <div>
        <p class="text-xs font-semibold text-indigo-500 uppercase tracking-widest" x-text="selectedDayDow"></p>
        <h2 class="text-xl font-bold text-slate-800" x-text="selectedDayLabel"></h2>
      </div>
      <div class="flex items-center gap-2">
        <span
          x-show="selectedDayEvents.length > 0"
          class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full"
          x-text="`${selectedDayEvents.length} event${selectedDayEvents.length !== 1 ? 's' : ''}`">
        </span>
        <button @click="closePanel()"
          class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 active:bg-slate-200 text-slate-500 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Scrollable Panel Body -->
    <div class="flex-1 overflow-y-auto scroll-y px-4 py-3 safe-bottom space-y-5">

      <!-- ── QUICK ADD FORM ── -->
      <div class="bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden">
        <button
          @click="addingEvent = !addingEvent"
          class="w-full flex items-center gap-2 px-4 py-3 text-sm font-semibold text-indigo-600 hover:bg-indigo-50 active:bg-indigo-100 transition-colors">
          <svg class="w-4 h-4 transition-transform duration-200" :class="addingEvent ? 'rotate-45' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
          <span x-text="addingEvent ? 'Cancel' : 'Add New Event'"></span>
        </button>

        <div x-show="addingEvent" x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
          <div class="px-4 pb-4 space-y-3">
            <!-- Title -->
            <input
              x-model="newEvent.title"
              @keydown.enter="addEvent()"
              type="text"
              placeholder="Event title…"
              class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent bg-white"
              autocomplete="off">

            <div class="grid grid-cols-2 gap-2">
              <!-- Time -->
              <div>
                <label class="text-xs font-semibold text-slate-500 mb-1 block">Time</label>
                <input
                  x-model="newEvent.time"
                  type="time"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
              </div>
              <!-- Priority -->
              <div>
                <label class="text-xs font-semibold text-slate-500 mb-1 block">Priority</label>
                <select
                  x-model="newEvent.priority"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                  <template x-for="p in priorities">
                    <option :value="p" x-text="p"></option>
                  </template>
                </select>
              </div>
            </div>

            <!-- Category -->
            <div>
              <label class="text-xs font-semibold text-slate-500 mb-1 block">Category</label>
              <div class="flex flex-wrap gap-1.5">
                <template x-for="cat in categories">
                  <button
                    @click="newEvent.category = cat"
                    :class="newEvent.category === cat ? categoryActiveClass(cat) : 'bg-white border border-slate-200 text-slate-500 hover:border-slate-300'"
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors"
                    x-text="cat">
                  </button>
                </template>
              </div>
            </div>

            <!-- Save -->
            <button
              @click="addEvent()"
              :disabled="!newEvent.title.trim()"
              class="w-full bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold text-sm py-3 rounded-xl transition-colors">
              Save Event
            </button>
          </div>
        </div>
      </div>

      <!-- ── PENDING EVENTS ── -->
      <div>
        <div class="flex items-center gap-2 mb-2">
          <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
          <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest">
            Pending
            <span x-show="pendingEvents.length > 0" class="ml-1 text-emerald-600" x-text="`(${pendingEvents.length})`"></span>
          </h3>
        </div>

        <div x-show="pendingEvents.length === 0" class="text-sm text-slate-400 italic py-2 pl-1">
          No pending events — all clear!
        </div>

        <div class="space-y-2">
          <template x-for="evt in pendingEvents" :key="evt.id">
            <div class="bg-white rounded-2xl border border-slate-200 p-3 flex items-start gap-3 hover:border-indigo-200 transition-colors shadow-sm">
              <!-- Checkbox -->
              <div class="flex items-center pt-0.5">
                <input type="checkbox"
                  :checked="evt.isCompleted"
                  @change="toggleEvent(evt.id)"
                  class="rounded-md">
              </div>
              <!-- Content -->
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-slate-800 leading-snug truncate" x-text="evt.title"></p>
                <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                  <span x-show="evt.timestamp" class="flex items-center gap-1 text-xs text-slate-500 font-medium">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span x-text="evt.timestamp"></span>
                  </span>
                  <span :class="categoryBadgeClass(evt.category)" class="text-xs font-semibold px-2 py-0.5 rounded-full" x-text="evt.category"></span>
                  <span :class="priorityBadgeClass(evt.priority)" class="text-xs font-semibold px-2 py-0.5 rounded-full" x-text="evt.priority"></span>
                </div>
              </div>
              <!-- Delete -->
              <button @click.stop="deleteEvent(evt.id)"
                class="w-8 h-8 flex items-center justify-center rounded-full text-slate-300 hover:text-red-400 hover:bg-red-50 active:bg-red-100 transition-colors shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </template>
        </div>
      </div>

      <!-- ── COMPLETED EVENTS ── -->
      <div x-show="completedEvents.length > 0">
        <button
          @click="showCompleted = !showCompleted"
          class="flex items-center gap-2 mb-2 w-full text-left group">
          <div class="w-2 h-2 rounded-full bg-slate-400"></div>
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest group-hover:text-slate-500 transition-colors">
            Completed
            <span x-text="`(${completedEvents.length})`" class="ml-1"></span>
          </h3>
          <svg
            class="w-4 h-4 text-slate-400 ml-auto transition-transform duration-200"
            :class="showCompleted ? 'rotate-180' : ''"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <div x-show="showCompleted" x-transition:enter="transition duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
          <div class="space-y-2">
            <template x-for="evt in completedEvents" :key="evt.id">
              <div class="bg-slate-50 rounded-2xl border border-slate-100 p-3 flex items-start gap-3 opacity-60">
                <!-- Undo checkbox -->
                <div class="flex items-center pt-0.5">
                  <input type="checkbox"
                    :checked="evt.isCompleted"
                    @change="toggleEvent(evt.id)"
                    class="rounded-md">
                </div>
                <!-- Content -->
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-semibold text-slate-500 line-through leading-snug truncate" x-text="evt.title"></p>
                  <div class="flex flex-wrap items-center gap-1.5 mt-1">
                    <span x-show="evt.timestamp" class="text-xs text-slate-400 font-medium" x-text="evt.timestamp"></span>
                    <span class="text-xs font-medium text-slate-400 bg-slate-200 px-2 py-0.5 rounded-full" x-text="evt.category"></span>
                  </div>
                </div>
                <!-- Delete -->
                <button @click.stop="deleteEvent(evt.id)"
                  class="w-8 h-8 flex items-center justify-center rounded-full text-slate-300 hover:text-red-400 hover:bg-red-50 transition-colors shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Bottom spacer -->
      <div class="h-4"></div>
    </div>
  </div>

  <!-- ═══════════ ALPINE.JS APP ═══════════ -->
  <script>
    // ─── CONFIGURATION ───────────────────────────────────────────────────────
    const GOOGLE_SCRIPT_WEBAPP_URL =
      'https://script.google.com/macros/s/AKfycbyb8USqH5nvZm8mnXYzH8ZVQXiaE-jgNh4UBC22pi2dNsoqmeqOKdh0jTPa7M8RXhYDMA/exec';
    const API_KEY = 'mango-jack-banana';

    // ─── ALPINE.JS APP ───────────────────────────────────────────────────────
    function calendarApp() {
      return {
        // ── state ──────────────────────────────────────────────────────────
        events:       [],
        loading:      true,
        syncing:      false,
        error:        null,

        today:        new Date(),
        viewYear:     new Date().getFullYear(),
        viewMonth:    new Date().getMonth(),

        selectedDate: null,
        panelOpen:    false,
        showCompleted: false,
        isMobile:     window.innerWidth < 768,

        addingEvent:  false,
        newEvent: {
          title:    '',
          time:     '09:00',
          category: 'Work',
          priority: 'Medium',
        },

        categories: ['Work', 'Personal', 'Health', 'Finance', 'Other'],
        priorities:  ['High', 'Medium', 'Low'],

        // ── lifecycle ──────────────────────────────────────────────────────
        init() {
          this.fetchEvents();
          window.addEventListener('resize', () => {
            this.isMobile = window.innerWidth < 768;
          });
          // Auto-dismiss error after 4 s
          this.$watch('error', val => {
            if (val) setTimeout(() => { this.error = null; }, 4000);
          });
        },

        // ── computed ───────────────────────────────────────────────────────
        get monthName() {
          return new Date(this.viewYear, this.viewMonth, 1)
            .toLocaleString('default', { month: 'long', year: 'numeric' });
        },

        get calendarDays() {
          const year  = this.viewYear;
          const month = this.viewMonth;

          const firstDow    = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const prevLast    = new Date(year, month, 0).getDate();

          const days = [];

          // Leading days from previous month
          for (let i = firstDow - 1; i >= 0; i--) {
            days.push({ date: new Date(year, month - 1, prevLast - i), isCurrentMonth: false });
          }

          // Current month
          for (let d = 1; d <= daysInMonth; d++) {
            days.push({ date: new Date(year, month, d), isCurrentMonth: true });
          }

          // Trailing days to fill 6 rows (42 cells)
          const remaining = 42 - days.length;
          for (let d = 1; d <= remaining; d++) {
            days.push({ date: new Date(year, month + 1, d), isCurrentMonth: false });
          }

          return days;
        },

        get selectedDayEvents() {
          if (!this.selectedDate) return [];
          const ds = this.fmtDate(this.selectedDate);
          return this.events.filter(e => e.date === ds);
        },

        get pendingEvents() {
          return [...this.selectedDayEvents]
            .filter(e => !e.isCompleted)
            .sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
        },

        get completedEvents() {
          return [...this.selectedDayEvents]
            .filter(e => e.isCompleted)
            .sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
        },

        get selectedDayLabel() {
          if (!this.selectedDate) return '';
          return this.selectedDate.toLocaleDateString('default',
            { month: 'long', day: 'numeric', year: 'numeric' });
        },

        get selectedDayDow() {
          if (!this.selectedDate) return '';
          return this.selectedDate.toLocaleDateString('default', { weekday: 'long' });
        },

        // ── helpers ────────────────────────────────────────────────────────
        fmtDate(date) {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        },

        isToday(date) {
          const t = this.today;
          return date.getFullYear() === t.getFullYear()
              && date.getMonth()    === t.getMonth()
              && date.getDate()     === t.getDate();
        },

        isSelected(date) {
          return this.selectedDate && this.fmtDate(date) === this.fmtDate(this.selectedDate);
        },

        eventsForDate(date) {
          const ds = this.fmtDate(date);
          return this.events.filter(e => e.date === ds);
        },

        // ── navigation ────────────────────────────────────────────────────
        prevMonth() {
          if (this.viewMonth === 0) { this.viewMonth = 11; this.viewYear--; }
          else { this.viewMonth--; }
        },

        nextMonth() {
          if (this.viewMonth === 11) { this.viewMonth = 0; this.viewYear++; }
          else { this.viewMonth++; }
        },

        goToToday() {
          this.viewYear  = this.today.getFullYear();
          this.viewMonth = this.today.getMonth();
        },

        // ── panel ─────────────────────────────────────────────────────────
        selectDay(date) {
          this.selectedDate  = date;
          this.panelOpen     = true;
          this.showCompleted = false;
          this.addingEvent   = false;
          this.resetNewEvent();
        },

        closePanel() {
          this.panelOpen = false;
        },

        // ── CRUD ──────────────────────────────────────────────────────────
        async fetchEvents() {
          this.loading = true;
          this.error   = null;
          try {
            const res  = await fetch(`${GOOGLE_SCRIPT_WEBAPP_URL}?key=${API_KEY}`);
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            this.events = data.map(row => ({
              ...row,
              isCompleted: row.isCompleted === true || row.isCompleted === 'TRUE',
            }));
          } catch (err) {
            console.error(err);
            this.error = 'Failed to load — check your connection.';
          } finally {
            this.loading = false;
          }
        },

        async addEvent() {
          const title = this.newEvent.title.trim();
          if (!title || !this.selectedDate) return;

          const event = {
            id:          `evt_${Date.now()}_${Math.random().toString(36).slice(2, 9)}`,
            title,
            date:        this.fmtDate(this.selectedDate),
            timestamp:   this.newEvent.time,
            category:    this.newEvent.category,
            priority:    this.newEvent.priority,
            isCompleted: false,
          };

          // Optimistic update
          this.events.push(event);
          this.resetNewEvent();
          this.addingEvent = false;

          // Background sync
          try {
            this.syncing = true;
            await this.apiCall({ action: 'add', key: API_KEY, event: JSON.stringify(event) });
          } catch (err) {
            console.error(err);
            this.events = this.events.filter(e => e.id !== event.id);
            this.error  = 'Failed to save event.';
          } finally {
            this.syncing = false;
          }
        },

        async toggleEvent(id) {
          const idx = this.events.findIndex(e => e.id === id);
          if (idx === -1) return;

          // Optimistic update
          const prev = this.events[idx].isCompleted;
          this.events[idx] = { ...this.events[idx], isCompleted: !prev };

          try {
            this.syncing = true;
            await this.apiCall({ action: 'toggle', key: API_KEY, id });
          } catch (err) {
            console.error(err);
            this.events[idx] = { ...this.events[idx], isCompleted: prev };
            this.error = 'Failed to update event.';
          } finally {
            this.syncing = false;
          }
        },

        async deleteEvent(id) {
          const backup = this.events.find(e => e.id === id);

          // Optimistic update
          this.events = this.events.filter(e => e.id !== id);

          try {
            this.syncing = true;
            await this.apiCall({ action: 'delete', key: API_KEY, id });
          } catch (err) {
            console.error(err);
            if (backup) this.events.push(backup);
            this.error = 'Failed to delete event.';
          } finally {
            this.syncing = false;
          }
        },

        // GET-only approach avoids CORS preflight issues with Apps Script
        async apiCall(params) {
          const qs   = new URLSearchParams(params);
          const res  = await fetch(`${GOOGLE_SCRIPT_WEBAPP_URL}?${qs}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          return data;
        },

        // ── form helpers ──────────────────────────────────────────────────
        resetNewEvent() {
          this.newEvent = { title: '', time: '09:00', category: 'Work', priority: 'Medium' };
        },

        // ── style helpers ─────────────────────────────────────────────────
        priorityEventClass(priority) {
          return {
            High:   'bg-red-100    text-red-700',
            Medium: 'bg-amber-100  text-amber-700',
            Low:    'bg-emerald-100 text-emerald-700',
          }[priority] || 'bg-slate-100 text-slate-600';
        },

        categoryBadgeClass(cat) {
          return {
            Work:     'bg-blue-100   text-blue-700',
            Personal: 'bg-violet-100 text-violet-700',
            Health:   'bg-emerald-100 text-emerald-700',
            Finance:  'bg-amber-100  text-amber-700',
            Other:    'bg-slate-100  text-slate-600',
          }[cat] || 'bg-slate-100 text-slate-600';
        },

        categoryActiveClass(cat) {
          return {
            Work:     'bg-blue-500   text-white border-blue-500',
            Personal: 'bg-violet-500 text-white border-violet-500',
            Health:   'bg-emerald-500 text-white border-emerald-500',
            Finance:  'bg-amber-500  text-white border-amber-500',
            Other:    'bg-slate-500  text-white border-slate-500',
          }[cat] || 'bg-indigo-500 text-white border-indigo-500';
        },

        priorityBadgeClass(p) {
          return {
            High:   'bg-red-100    text-red-700',
            Medium: 'bg-amber-100  text-amber-700',
            Low:    'bg-slate-100  text-slate-600',
          }[p] || 'bg-slate-100 text-slate-600';
        },
      };
    }
  </script>
</body>
